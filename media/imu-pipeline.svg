<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
<title id="title">A timestamped, gyro-driven IMU pipeline</title><desc id="desc">IRQ timestamps travel with asynchronous samples; fusion timing follows gyro timestamps. Code-derived conceptual flow; not measured hardware or flight evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2474b7"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#237b77"/></marker></defs>
<rect x="0" y="0" width="1600" height="1110" rx="0" fill="#faf8f3" stroke="none" stroke-width="2"/>
<text x="60" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#2474b7" font-weight="700" letter-spacing="3">STM32 FLIGHT CONTROLLER</text>
<text x="60" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="49" fill="#152c46" font-weight="700" letter-spacing="0">A timestamped, gyro-driven IMU pipeline</text>
<text x="60" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">IRQ timestamps travel with asynchronous samples; fusion timing follows gyro timestamps.</text>
<rect x="60" y="250" width="440" height="220" rx="20" fill="white" stroke="#d9e1e8" stroke-width="2"/>
<rect x="82" y="275" width="5" height="32" rx="2" fill="#2474b7" stroke="none" stroke-width="2"/>
<text x="103" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#152c46" font-weight="700" letter-spacing="0">01  DRDY capture</text>
<text x="88" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Timestamp accel / gyro edges</text>
<text x="88" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Apply deglitch thresholds</text>
<text x="88" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Publish latest pending event</text>
<text x="88" y="446" font-family="Consolas, monospace" font-size="20" fill="#54667a" font-weight="400" letter-spacing="0">main.c · pipeline.c</text>
<rect x="580" y="250" width="440" height="220" rx="20" fill="white" stroke="#d9e1e8" stroke-width="2"/>
<rect x="602" y="275" width="5" height="32" rx="2" fill="#2474b7" stroke="none" stroke-width="2"/>
<text x="623" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#152c46" font-weight="700" letter-spacing="0">02  SPI DMA arbitration</text>
<text x="608" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Choose one sensor transfer</text>
<text x="608" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Prefer gyro; serve pending accel</text>
<text x="608" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">after 3 completed gyro reads</text>
<text x="608" y="446" font-family="Consolas, monospace" font-size="20" fill="#54667a" font-weight="400" letter-spacing="0">pipeline.c</text>
<rect x="1100" y="250" width="440" height="220" rx="20" fill="white" stroke="#d9e1e8" stroke-width="2"/>
<rect x="1122" y="275" width="5" height="32" rx="2" fill="#2474b7" stroke="none" stroke-width="2"/>
<text x="1143" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#152c46" font-weight="700" letter-spacing="0">03  Frontend + data rings</text>
<text x="1128" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Scale / bias / filter raw vectors</text>
<text x="1128" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Push timestamped accel + gyro</text>
<text x="1128" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Drop oldest on overflow</text>
<text x="1128" y="446" font-family="Consolas, monospace" font-size="20" fill="#54667a" font-weight="400" letter-spacing="0">imu_bmi088_frontend.c</text>
<rect x="1100" y="620" width="440" height="220" rx="20" fill="white" stroke="#d9e1e8" stroke-width="2"/>
<rect x="1122" y="645" width="5" height="32" rx="2" fill="#2474b7" stroke="none" stroke-width="2"/>
<text x="1143" y="671" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#152c46" font-weight="700" letter-spacing="0">04  Causal time pairing</text>
<text x="1128" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Pop oldest gyro; derive dt</text>
<text x="1128" y="746" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Use latest accel at or before gyro</text>
<text x="1128" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Reject reversed gyro timestamps</text>
<text x="1128" y="816" font-family="Consolas, monospace" font-size="20" fill="#54667a" font-weight="400" letter-spacing="0">sync_pair.c</text>
<rect x="580" y="620" width="440" height="220" rx="20" fill="white" stroke="#d9e1e8" stroke-width="2"/>
<rect x="602" y="645" width="5" height="32" rx="2" fill="#2474b7" stroke="none" stroke-width="2"/>
<text x="623" y="671" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#152c46" font-weight="700" letter-spacing="0">05  Mahony 6-DoF</text>
<text x="608" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Update quaternion from gyro</text>
<text x="608" y="746" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Use accel only within age limit</text>
<text x="608" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Expose Euler attitude + gyro</text>
<text x="608" y="816" font-family="Consolas, monospace" font-size="20" fill="#54667a" font-weight="400" letter-spacing="0">fusion_mahony.c</text>
<rect x="60" y="620" width="440" height="220" rx="20" fill="white" stroke="#d9e1e8" stroke-width="2"/>
<rect x="82" y="645" width="5" height="32" rx="2" fill="#2474b7" stroke="none" stroke-width="2"/>
<text x="103" y="671" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#152c46" font-weight="700" letter-spacing="0">06  Control scheduling</text>
<text x="88" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Select budget from gyro queue</text>
<text x="88" y="746" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Catch up when sample lag grows</text>
<text x="88" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Step control using derived dt</text>
<text x="88" y="816" font-family="Consolas, monospace" font-size="20" fill="#54667a" font-weight="400" letter-spacing="0">main.c → fc_core.c</text>
<path d="M 500 360 L 580 360" fill="none" stroke="#2474b7" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1020 360 L 1100 360" fill="none" stroke="#2474b7" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1320 470 L 1320 620" fill="none" stroke="#2474b7" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1100 730 L 1020 730" fill="none" stroke="#2474b7" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 580 730 L 500 730" fill="none" stroke="#2474b7" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="60" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#152c46" font-weight="700" letter-spacing="0">Pending IRQs are coalesced.</text>
<text x="60" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#54667a" font-weight="400" letter-spacing="0">Latest timestamps are retained; merge-drop counters record skipped events.</text>
<text x="1100" y="530" font-family="Consolas, monospace" font-size="21" fill="#54667a" font-weight="400" letter-spacing="0">ringbuf_spsc.c</text>
<rect x="60" y="913" width="1480" height="105" rx="20" fill="#152c46" stroke="none" stroke-width="2"/>
<text x="88" y="954" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#91caef" font-weight="700" letter-spacing="2">OBSERVABILITY</text>
<text x="358" y="954" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="400" letter-spacing="0">IRQ intervals · queue depth · merge / sweep drops · pairing age · DMA timeouts</text>
<text x="88" y="991" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#d9e8f4" font-weight="400" letter-spacing="0">Configured rates and limits describe code policy; measured timing evidence remains separate.</text>
<text x="60" y="1072" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#54667a" font-weight="400" letter-spacing="0">Sources: pipeline.c / ringbuf_spsc.c / sync_pair.c / fusion_mahony.c / main.c. No synthetic measurements.</text>
</svg>
